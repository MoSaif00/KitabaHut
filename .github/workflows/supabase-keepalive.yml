name: Supabase Keep Alive

on:
  schedule:
    # Every 6 hours — Free projects pause after ~7 days of low DB activity.
    # A single daily SELECT 1 is often not enough for Supabase's threshold.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping kitaba database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ping Supabase with real table activity
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "Missing secret: DIRECT_URL"
            exit 1
          fi

          # Writes + reads against app tables register as user database activity.
          psql "$DIRECT_URL" \
            -v ON_ERROR_STOP=1 \
            <<'SQL'
          CREATE TABLE IF NOT EXISTS "_keepalive" (
            id int PRIMARY KEY DEFAULT 1,
            last_ping timestamptz NOT NULL DEFAULT now(),
            ping_count bigint NOT NULL DEFAULT 0
          );

          INSERT INTO "_keepalive" (id, last_ping, ping_count)
          VALUES (1, now(), 1)
          ON CONFLICT (id) DO UPDATE
          SET last_ping = now(),
              ping_count = "_keepalive".ping_count + 1;

          SELECT count(*) AS users FROM "User";
          SELECT count(*) AS sites FROM "Site";
          SELECT count(*) AS posts FROM "Post";
          SELECT id, last_ping, ping_count FROM "_keepalive" WHERE id = 1;
          SQL
